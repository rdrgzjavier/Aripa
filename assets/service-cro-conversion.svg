<svg width="960" height="720" viewBox="0 0 960 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffdfb"/>
      <stop offset="0.5" stop-color="#fcf9f8"/>
      <stop offset="1" stop-color="#f5efff"/>
    </linearGradient>
    <linearGradient id="funnel-grad-1" x1="480" y1="180" x2="480" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#6b38fb"/>
    </linearGradient>
    <linearGradient id="funnel-grad-2" x1="480" y1="310" x2="480" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6b38fb"/>
      <stop offset="1" stop-color="#061542"/>
    </linearGradient>
    <filter id="glow" x="200" y="100" width="560" height="520" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#6b38fb" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="960" height="720" fill="url(#bg)"/>
  
  <!-- Subtle decorative ambient orbs -->
  <circle cx="780" cy="180" r="140" fill="#6b38fb" opacity="0.04"/>
  <circle cx="180" cy="540" r="160" fill="#061542" opacity="0.03"/>
  
  <!-- Minimalist Funnel Art -->
  <g filter="url(#glow)">
    <!-- Top Funnel Ring -->
    <path d="M220 220 C 220 180, 740 180, 740 220 C 740 260, 220 260, 220 220 Z" fill="url(#funnel-grad-1)" opacity="0.8"/>
    <ellipse cx="480" cy="220" rx="260" ry="40" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.6"/>

    <!-- Mid Funnel Ring -->
    <path d="M320 370 C 320 340, 640 340, 640 370 C 640 400, 320 400, 320 370 Z" fill="url(#funnel-grad-2)" opacity="0.9"/>
    <ellipse cx="480" cy="370" rx="160" ry="25" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.4"/>

    <!-- Bottom Funnel Ring (Active) -->
    <ellipse cx="480" cy="510" rx="70" ry="12" fill="#061542"/>
    <ellipse cx="480" cy="510" rx="70" ry="12" fill="none" stroke="#6b38fb" stroke-width="4"/>
    
    <!-- Connectors -->
    <path d="M220 220 L320 370 M740 220 L640 370 M320 370 L410 510 M640 370 L550 510" stroke="#6b38fb" stroke-width="3" stroke-dasharray="10 8" opacity="0.3"/>
  </g>
</svg>
