<svg width="960" height="720" viewBox="0 0 960 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffdfb"/>
      <stop offset="0.5" stop-color="#fcf9f8"/>
      <stop offset="1" stop-color="#f5efff"/>
    </linearGradient>
    <filter id="shadow" x="180" y="100" width="600" height="520" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#6b38fb" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="960" height="720" fill="url(#bg)"/>
  
  <circle cx="820" cy="220" r="130" fill="#6b38fb" opacity="0.04"/>
  <circle cx="160" cy="500" r="140" fill="#061542" opacity="0.03"/>
  
  <g filter="url(#shadow)">
    <!-- Base Panel -->
    <rect x="230" y="140" width="500" height="380" rx="32" fill="#ffffff" stroke="#e8e2f5" stroke-width="4"/>
    
    <!-- Y-Axis Grid Lines -->
    <line x1="280" y1="420" x2="680" y2="420" stroke="#f3f4f6" stroke-width="2"/>
    <line x1="280" y1="330" x2="680" y2="330" stroke="#f3f4f6" stroke-width="2"/>
    <line x1="280" y1="240" x2="680" y2="240" stroke="#f3f4f6" stroke-width="2"/>
    
    <!-- Abstract Bar Charts -->
    <rect x="310" y="350" width="30" height="70" rx="8" fill="#6b38fb" fill-opacity="0.1"/>
    <rect x="380" y="290" width="30" height="130" rx="8" fill="#6b38fb" fill-opacity="0.2"/>
    <rect x="450" y="260" width="30" height="160" rx="8" fill="#6b38fb" fill-opacity="0.3"/>
    <rect x="520" y="190" width="30" height="230" rx="8" fill="#061542" fill-opacity="0.8"/>
    <rect x="590" y="220" width="30" height="200" rx="8" fill="#6b38fb"/>
    
    <!-- Soaring Trend Line overlay -->
    <path d="M325 330 Q 425 310, 465 240 T 605 170" stroke="#6b38fb" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Highlight Nodes -->
    <circle cx="465" cy="240" r="10" fill="#6b38fb" stroke="#ffffff" stroke-width="3"/>
    <circle cx="605" cy="170" r="12" fill="#061542" stroke="#ffffff" stroke-width="4"/>
  </g>
</svg>
