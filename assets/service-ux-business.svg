<svg width="960" height="720" viewBox="0 0 960 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffdfb"/>
      <stop offset="0.5" stop-color="#fcf9f8"/>
      <stop offset="1" stop-color="#f5efff"/>
    </linearGradient>
    <filter id="shadow" x="180" y="100" width="600" height="520" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#061542" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="960" height="720" fill="url(#bg)"/>
  
  <!-- Ambient Orbs -->
  <circle cx="200" cy="200" r="120" fill="#6b38fb" opacity="0.04"/>
  <circle cx="800" cy="500" r="150" fill="#061542" opacity="0.03"/>
  
  <!-- Minimalist UX Layout -->
  <g filter="url(#shadow)">
    <!-- Main Browser Container -->
    <rect x="230" y="140" width="500" height="380" rx="32" fill="#ffffff" stroke="#e8e2f5" stroke-width="4"/>
    
    <!-- Browser Dots -->
    <circle cx="280" cy="180" r="8" fill="#ef4444" opacity="0.5"/>
    <circle cx="304" cy="180" r="8" fill="#f59e0b" opacity="0.5"/>
    <circle cx="328" cy="180" r="8" fill="#10b981" opacity="0.5"/>
    
    <!-- Main Banner Element -->
    <rect x="270" y="220" width="420" height="100" rx="20" fill="#6b38fb" fill-opacity="0.08" stroke="#6b38fb" stroke-opacity="0.2" stroke-width="2"/>
    
    <!-- Hero Button Mockup -->
    <rect x="310" y="250" width="120" height="40" rx="20" fill="#061542"/>
    <circle cx="610" cy="270" r="24" fill="#6b38fb" opacity="0.8"/>
    
    <!-- Grid Modules -->
    <rect x="270" y="350" width="195" height="120" rx="20" fill="#fcf9f8" stroke="#e8e2f5" stroke-width="2"/>
    <rect x="495" y="350" width="195" height="120" rx="20" fill="#fcf9f8" stroke="#e8e2f5" stroke-width="2"/>
    
    <!-- Simple wire lines inside modules -->
    <rect x="300" y="380" width="80" height="12" rx="6" fill="#061542" opacity="0.1"/>
    <rect x="300" y="404" width="130" height="8" rx="4" fill="#061542" opacity="0.05"/>
    <rect x="300" y="420" width="100" height="8" rx="4" fill="#061542" opacity="0.05"/>
    
    <rect x="525" y="380" width="80" height="12" rx="6" fill="#6b38fb" opacity="0.2"/>
    <rect x="525" y="404" width="130" height="8" rx="4" fill="#061542" opacity="0.05"/>
    <rect x="525" y="420" width="100" height="8" rx="4" fill="#061542" opacity="0.05"/>
  </g>
</svg>
