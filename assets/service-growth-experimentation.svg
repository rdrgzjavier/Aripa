<svg width="960" height="720" viewBox="0 0 960 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffdfb"/>
      <stop offset="0.5" stop-color="#fcf9f8"/>
      <stop offset="1" stop-color="#f5efff"/>
    </linearGradient>
    <filter id="glow" x="180" y="80" width="600" height="540" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="30" stdDeviation="35" flood-color="#6b38fb" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="960" height="720" fill="url(#bg)"/>
  
  <circle cx="780" cy="200" r="150" fill="#6b38fb" opacity="0.04"/>
  <circle cx="180" cy="520" r="130" fill="#061542" opacity="0.03"/>
  
  <g filter="url(#glow)">
    <!-- Base Panel -->
    <rect x="230" y="140" width="500" height="380" rx="32" fill="#ffffff" stroke="#e8e2f5" stroke-width="4"/>
    
    <!-- Grid ground line -->
    <line x1="280" y1="440" x2="680" y2="440" stroke="#e5e7eb" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Steps -->
    <!-- Step 1 -->
    <rect x="310" y="380" width="90" height="60" rx="12" fill="#6b38fb" fill-opacity="0.08" stroke="#6b38fb" stroke-opacity="0.2" stroke-width="2"/>
    <!-- Step 2 -->
    <rect x="430" y="300" width="90" height="140" rx="12" fill="#6b38fb" fill-opacity="0.15" stroke="#6b38fb" stroke-opacity="0.3" stroke-width="2"/>
    <!-- Step 3 -->
    <rect x="550" y="200" width="90" height="240" rx="12" fill="#061542"/>
    
    <!-- Dynamic soaring curve arrow -->
    <path d="M355 350 C 430 330, 480 250, 595 160" stroke="#6b38fb" stroke-width="8" stroke-linecap="round"/>
    <!-- Arrow head -->
    <path d="M560 162 L600 156 L594 196" stroke="#6b38fb" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Target Dot -->
    <circle cx="595" cy="160" r="10" fill="#6b38fb" stroke="#ffffff" stroke-width="3"/>
  </g>
</svg>
